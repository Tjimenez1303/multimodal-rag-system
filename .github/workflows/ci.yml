name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and import contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.19"
      - name: Install dependencies
        run: uv sync --locked --directory backend
      - name: Run pre-commit hooks
        run: uv run --project backend pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests with coverage gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.19"
      - name: Install dependencies
        run: uv sync --locked
      # Docling's model prefetching for offline use, cached like Docling's own CI:
      # the models change only with the locked Docling version or the model list.
      - name: Restore extraction models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/docling-models
          key: docling-models-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'backend/docling_models.txt') }}
      - name: Download extraction models
        if: steps.models.outputs.cache-hit != 'true'
        run: uv run docling-tools models download $(cat docling_models.txt) --output-dir "$DOCLING_ARTIFACTS_PATH"
        env:
          DOCLING_ARTIFACTS_PATH: ${{ runner.temp }}/docling-models
      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing
        env:
          DOCLING_ARTIFACTS_PATH: ${{ runner.temp }}/docling-models
