# Same checks as CI. Install once with: uv run --project backend pre-commit install
# Files generated and refreshed by Spec Kit are excluded so its upgrades stay clean.
exclude: ^(\.specify/|\.claude/skills/)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/crate-ci/typos
    rev: 00f422f3b19c57bc6338715ebfe3316d38768461  # frozen: v1.50.3
    hooks:
      - id: typos
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run --directory backend mypy
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: import-linter
        name: import contracts
        entry: uv run --directory backend lint-imports
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: frontend-lint
        name: frontend lint (oxlint)
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-format
        name: frontend format (prettier)
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-typecheck
        name: frontend type check (tsc)
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
        files: ^frontend/
