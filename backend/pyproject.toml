[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Multimodal RAG system for technical PDF manuals"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "docling>=2.130,<3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "onnxruntime>=1.30.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "stamina>=26.1.0",
    "structlog>=26.1.0",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.0.1",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "testcontainers[postgres,qdrant]>=4.15.0",
    "types-reportlab>=5.0.0.20260911",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "T20", "G", "ASYNC", "TID251", "D"]
# Constructor arguments are documented in the class docstring (Google style).
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Autogenerated revisions embed long SQL literals from the schema metadata.
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock.MagicMock".msg = "Use a fake that implements the port."
"unittest.mock.Mock".msg = "Use a fake that implements the port."

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "migrations"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "integration: needs real services started with testcontainers",
    "slow: takes more than a few seconds, such as model-backed extraction",
]

[tool.coverage.run]
source = ["multimodal_rag"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "multimodal_rag"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The ingestion core depends on no adapter, framework, SDK or provider"
type = "forbidden"
source_modules = ["multimodal_rag.ingestion"]
forbidden_modules = [
    "multimodal_rag.adapters",
    "multimodal_rag.bootstrap",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "docling",
    "docling_core",
    "pypdfium2",
    "pypdf",
    "reportlab",
    "rapidocr",
    "onnxruntime",
    "torch",
    "torchvision",
    "uvicorn",
    "httpx",
    "httpx2",
    "qdrant_client",
    "pydantic_settings",
    "structlog",
    "stamina",
    "tokenizers",
]

[[tool.importlinter.contracts]]
name = "Dependencies point inward: bootstrap, adapters, ingestion, shared"
type = "layers"
layers = [
    "(multimodal_rag.bootstrap)",
    "multimodal_rag.adapters",
    "multimodal_rag.ingestion",
    "multimodal_rag.shared",
]
