# Labeled questions for the reranked relevance gate (specs/004-reranked-relevance-gate).
#
# Each entry is one question sent to the system after the sample documents are
# ingested. The label says what the relevance gate should decide:
#   answerable     the document holds the answer, so the question must reach the
#                  answer model. expected_document and expected_pages name where
#                  the answer lives.
#   hard_negative  the question is on the topic of expected_document, but the
#                  document does not contain the requested fact, so the system must
#                  answer that it does not have enough information.
#   unrelated      the question has nothing to do with any ingested document.
#
# expected_pages are 1-based PDF page numbers (the first page of the file is 1),
# not the page numbers printed in the document footers. identifier holds a token
# with a digit exactly as the document writes it, for questions that hinge on it.
questions:
