# Starts the whole system with one command: docker compose up
#
# Prerequisite, once per machine: enable Docker Model Runner so the models run on the
# host GPU. On macOS and Windows:
#   docker desktop enable model-runner --tcp 12434 --cors none
# On Linux, install the docker-model-plugin package. Copy .env.example to .env first.

name: multimodal-rag

x-backend: &backend
  build:
    context: ./backend
  image: multimodal-rag-backend:local

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  BLOB_ROOT: /data/blobs
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # The API stores it on each job it creates and the worker enforces it.
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      # The image ships bash but no curl, so the probe sends the HTTP request itself.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["python", "-m", "multimodal_rag", "api"]
    environment:
      <<: *backend-env
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      MAX_UPLOAD_PAGES: ${MAX_UPLOAD_PAGES:-500}
      # The frontend reads the same value, so its selection limit matches the API's.
      MAX_FILTER_DOCUMENTS: ${MAX_FILTER_DOCUMENTS:-20}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - blobs:/data/blobs
    # Questions are answered by the same model instances the worker uses, and the
    # reranker judges the retrieved units for the API alone. The API has no dependency
    # on Qdrant and calls the models only when a question arrives, so uploads and job
    # status keep working while search, the reranker or the answer model is down.
    models:
      vlm:
        endpoint_var: ANSWER_MODEL_URL
        model_var: ANSWER_MODEL
      embedder:
        endpoint_var: EMBEDDER_URL
        model_var: EMBEDDER_MODEL
      reranker:
        endpoint_var: RERANKER_URL
        model_var: RERANKER_MODEL
    ports:
      - "127.0.0.1:${API_PUBLISHED_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
      start_interval: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "multimodal_rag", "worker"]
    environment:
      <<: *backend-env
      QDRANT_URL: http://qdrant:6333
      FIGURE_DESCRIPTION_ENABLED: ${FIGURE_DESCRIPTION_ENABLED:-true}
    volumes:
      - blobs:/data/blobs
    models:
      vlm:
        endpoint_var: VLM_URL
        model_var: VLM_MODEL
      embedder:
        endpoint_var: EMBEDDER_URL
        model_var: EMBEDDER_MODEL
    healthcheck:
      # Healthy while the worker's liveness file is younger than LIVENESS_MAX_AGE_SECONDS.
      test: ["CMD", "python", "-m", "multimodal_rag", "worker-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    # A stop cancels the running attempt, whose page batch can take up to
    # EXTRACTION_BATCH_TIMEOUT_SECONDS (120 s) to return. The default 10 s grace
    # would kill the worker before it exits cleanly.
    stop_grace_period: 150s
    # The worker also exits after WORKER_MAX_JOBS jobs to release memory, and is
    # restarted here.
    restart: unless-stopped

  # The chat client: nginx serves the static build and proxies /api to the API, so the
  # browser talks to one origin.
  frontend:
    build:
      context: ./frontend
    image: multimodal-rag-frontend:local
    environment:
      ANSWER_WAIT_SECONDS: ${ANSWER_WAIT_SECONDS:-105}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-120}
      MAX_FILTER_DOCUMENTS: ${MAX_FILTER_DOCUMENTS:-20}
      STATUS_POLL_SECONDS: ${STATUS_POLL_SECONDS:-2}
    ports:
      - "127.0.0.1:${FRONTEND_PUBLISHED_PORT:-3000}:80"
    healthcheck:
      # BusyBox wget, shipped with the Alpine image.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
      start_interval: 1s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

models:
  vlm:
    model: ai/qwen3.5:9b
    context_size: 16384
    runtime_flags:
      - --chat-template-kwargs
      - '{"enable_thinking": false}'
  embedder:
    model: ai/qwen3-embedding:0.6b
    context_size: 8192
    runtime_flags:
      - --embeddings
      - --ubatch-size
      - "2048"
      - --batch-size
      - "2048"
  # Scored through chat completions with log probabilities, so it runs in completion
  # mode. Each of its 4 slots holds one 2,048-token judging request.
  reranker:
    model: ai/qwen3-reranker:0.6B
    context_size: 8192

volumes:
  pgdata:
  qdrant:
  blobs:
