openapi: 3.1.0
info:
  title: Multimodal RAG ingestion API
  version: 0.1.0
  description: >
    Upload technical PDFs, follow their asynchronous ingestion and inspect what was
    captured. Errors use RFC 9457 problem details. Every response carries an
    X-Request-ID header, echoed from the request or generated by the server.
servers:
  - url: http://localhost:8000
paths:
  /api/v1/documents:
    post:
      operationId: uploadDocument
      summary: Upload a PDF and start its ingestion
      description: >
        Stores the file, registers the document by the SHA-256 of its bytes and enqueues an
        ingestion job. Processing happens in the background. When the same content was
        already ingested successfully, the existing document and job are returned with
        already_ingested=true and no new job is created.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file, at most 200 MB and 500 pages by default.
      responses:
        "202":
          description: New job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadAccepted" }
        "200":
          description: Identical content already ingested; existing document returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listDocuments
      summary: List known documents with their latest job status
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of documents, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentPage" }
  /api/v1/documents/{document_id}:
    get:
      operationId: getDocument
      summary: Get a document and its latest job
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/documents/{document_id}/elements:
    get:
      operationId: listDocumentElements
      summary: List the captured elements of a completed document
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ElementKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of elements in reading order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElementPage" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: The document has no completed ingestion yet
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/documents/{document_id}/images/{element_id}:
    get:
      operationId: getDocumentImage
      summary: Get the stored crop of an image element
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: element_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Get the state and progress of an ingestion job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/Problem" }
  /health/live:
    get:
      operationId: liveness
      summary: The process is running
      responses:
        "200": { description: Alive }
  /health/ready:
    get:
      operationId: readiness
      summary: Dependencies (database, blob storage) are reachable
      responses:
        "200": { description: Ready }
        "503": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as next_cursor by the previous page.
      schema: { type: string }
  responses:
    Problem:
      description: Error in RFC 9457 format
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    UploadAccepted:
      type: object
      required: [document_id, job_id, status, already_ingested]
      properties:
        document_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        already_ingested: { type: boolean }
    JobStatus:
      type: string
      enum: [pending, processing, completed, failed]
    JobStage:
      type: string
      enum: [extracting, describing_figures, building_units, embedding, indexing, finalizing]
    FailureCode:
      type: string
      enum:
        - encrypted_document
        - corrupt_document
        - no_extractable_text
        - provider_unavailable
        - interrupted_repeatedly
        - internal_error
    Job:
      type: object
      required: [id, document_id, status, attempt, max_attempts, pages_done, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/JobStatus" }
        stage: { oneOf: [{ $ref: "#/components/schemas/JobStage" }, { type: "null" }] }
        attempt: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        pages_done: { type: integer, minimum: 0 }
        pages_total: { type: [integer, "null"], minimum: 1 }
        failure_code: { oneOf: [{ $ref: "#/components/schemas/FailureCode" }, { type: "null" }] }
        failure_reason: { type: [string, "null"] }
        summary: { oneOf: [{ $ref: "#/components/schemas/JobSummary" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    JobSummary:
      type: object
      required:
        - pages
        - text_elements
        - tables
        - table_chains
        - images
        - figures_described
        - figures_skipped
        - figures_not_described
        - retrieval_units
        - recognized_pages
      properties:
        pages: { type: integer }
        text_elements: { type: integer }
        tables: { type: integer }
        table_chains: { type: integer, description: Tables that continue across pages }
        images: { type: integer }
        figures_described: { type: integer }
        figures_skipped: { type: integer }
        figures_not_described: { type: integer }
        retrieval_units: { type: integer }
        recognized_pages: { type: integer, description: Pages that went through text recognition }
    Document:
      type: object
      required: [id, file_name, size_bytes, created_at, latest_job]
      properties:
        id: { type: string, format: uuid }
        file_name: { type: string }
        size_bytes: { type: integer }
        page_count: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }
        latest_job: { $ref: "#/components/schemas/Job" }
    DocumentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        next_cursor: { type: [string, "null"] }
    ElementKind:
      type: string
      enum: [heading, paragraph, list_item, caption, table, image, page_furniture]
    BoundingBox:
      type: object
      description: PDF points with a top-left origin.
      required: [left, top, right, bottom, origin]
      properties:
        left: { type: number }
        top: { type: number }
        right: { type: number }
        bottom: { type: number }
        origin: { type: string, const: top_left }
    Element:
      type: object
      required: [id, kind, page, bbox, reading_order, origin]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ElementKind" }
        page: { type: integer, minimum: 1 }
        bbox: { $ref: "#/components/schemas/BoundingBox" }
        reading_order: { type: integer }
        heading_level: { type: [integer, "null"] }
        text: { type: [string, "null"] }
        table:
          type: [object, "null"]
          properties:
            rows: { type: integer }
            columns: { type: integer }
            cells:
              type: array
              items:
                type: array
                items: { type: string }
        origin: { type: string, enum: [text_layer, recognized] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        image_url: { type: [string, "null"], description: Relative URL of the crop }
        image_class: { type: [string, "null"] }
        labels:
          type: array
          items: { type: string }
        description: { type: [string, "null"] }
        description_status:
          type: [string, "null"]
          enum: [described, skipped, not_described, null]
        unverified_identifiers:
          type: array
          items: { type: string }
        is_decorative: { type: boolean }
        relationships:
          type: array
          items:
            type: object
            required: [target_id, kind]
            properties:
              target_id: { type: string, format: uuid }
              kind: { type: string, enum: [caption_of, title_of, describes, near, continues] }
    ElementPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Element" }
        next_cursor: { type: [string, "null"] }
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: >
            Stable machine-readable code, for example unsupported_media_type,
            file_too_large, page_limit_exceeded, job_not_found, document_not_found,
            ingestion_not_completed.
        request_id: { type: string }
